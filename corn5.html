<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深夜不睡覺：熬夜與宵夜解鎖大師</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-16">

  <nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <span class="text-xl font-black bg-gradient-to-r text-transparent bg-clip-text from-indigo-400 to-cyan-400">🌙 FCU 熬夜與宵夜解鎖器</span>
      <span class="text-xs text-slate-400 border border-slate-700 px-3 py-1 rounded-full bg-slate-800">GitHub Verified</span>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <div class="lg:col-span-1 space-y-6">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">🧠 狀態輸入</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-slate-400 mb-1">明天第一堂課時間 (點)</label>
            <input type="number" id="classTime" min="0" max="23" value="8" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-sm text-slate-400 mb-1">剩餘工作量估計 (小時)</label>
            <input type="number" id="remainingWork" min="0" step="0.5" value="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <div class="flex justify-between text-sm text-slate-400 mb-1">
              <label>當前精神狀態</label>
              <span id="mentalVal" class="text-indigo-400 font-bold">7 分</span>
            </div>
            <input type="range" id="mentalState" min="1" max="10" value="7" oninput="document.getElementById('mentalVal').innerText = this.value + ' 分'" class="w-full accent-indigo-500">
          </div>
          <button onclick="calculateDecision()" class="w-full bg-indigo-600 hover:bg-indigo-500 transition-colors text-white font-bold py-3 rounded-xl mt-2 shadow-lg shadow-indigo-600/30">
            開始決策判定
          </button>
        </div>
      </div>

      <div id="decisionResult" class="hidden p-5 rounded-2xl border transition-all duration-300 shadow-lg bg-slate-900 border-slate-800">
        <h3 class="text-xs uppercase tracking-wider font-bold opacity-60">系統分析結果</h3>
        <p id="decisionTitle" class="text-2xl font-black my-2"></p>
        <p id="decisionReason" class="text-sm leading-relaxed opacity-90"></p>
      </div>
    </div>

    <div class="lg:col-span-2 space-y-6 relative">
      
      <div id="snackLockOverlay" class="absolute inset-0 bg-slate-950/85 z-40 rounded-2xl flex flex-col items-center justify-center text-center p-6 backdrop-blur-sm transition-all duration-300">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-sm shadow-2xl">
          <span class="text-4xl">🔒</span>
          <h3 class="text-xl font-black text-slate-200 mt-4 mb-2">宵夜模組尚未解鎖</h3>
          <p class="text-xs text-slate-400 leading-relaxed">請先填寫左側狀態並點擊「開始決策判定」。如果通過考驗被允許熬夜，系統才會為您開啟逢甲深夜美食清單！</p>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
        <h3 class="text-sm font-bold text-slate-400 mb-2 flex items-center gap-2">📍 逢甲大學深夜雷達地圖</h3>
        <div id="map" class="w-full h-60 bg-slate-800 rounded-xl border border-slate-700 relative overflow-hidden">
          <div class="absolute inset-0 flex items-center justify-center text-slate-500 text-xs">
            正在引導 Google 地圖連線中...
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">⚖️ 逢甲深夜美食交叉對比</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-slate-950 p-4 rounded-xl border-2 border-dashed border-slate-800 min-h-[160px] transition-all duration-200" 
               id="compareSlotA" 
               ondragover="allowDrop(event)" 
               ondragleave="clearDragStyle(this)" 
               ondrop="dropFood(event, 'A')">
            <p class="text-center text-sm text-slate-600 py-12 pointer-events-none">⬅️ 拖曳宵夜卡片至此 (欄位 A)</p>
          </div>
          <div class="bg-slate-950 p-4 rounded-xl border-2 border-dashed border-slate-800 min-h-[160px] transition-all duration-200" 
               id="compareSlotB" 
               ondragover="allowDrop(event)" 
               ondragleave="clearDragStyle(this)" 
               ondrop="dropFood(event, 'B')">
            <p class="text-center text-sm text-slate-600 py-12 pointer-events-none">➡️ 拖曳宵夜卡片至此 (欄位 B)</p>
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
          <div>
            <h2 class="text-lg font-bold text-slate-200">🍔 逢甲大學周邊深夜宵夜名單</h2>
            <p class="text-xs text-slate-500">可「滑鼠拖曳」至上方雙欄位，或直接「點擊卡片」自動填入</p>
          </div>
          <button onclick="triggerNearbySearch()" class="bg-slate-800 hover:bg-slate-700 text-xs text-indigo-400 px-3 py-2 rounded-xl border border-slate-700 transition-colors shrink-0">
            🔄 Places API 實時刷新 (架構預留)
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="snackGrid"></div>
      </div>

    </div>
  </main>

  <script>
    const fcuMidnightFoods = [
      { id: 1, name: "官芝霖大腸包小腸", type: "經典必吃", score: 4.1, time: "16:00 - 23:30", dist: "逢甲正門 120m", desc: "逢甲夜市最出名的排隊炭烤小吃，蒜香濃厚。", lat: 24.1798, lng: 120.6461 },
      { id: 2, name: "一心素食臭豆腐", type: "在地台式", score: 4.3, time: "16:00 - 00:00", dist: "便當街 150m", desc: "酥脆豆腐搭配滿滿泡菜，特製麵線深夜大滿足。", lat: 24.1802, lng: 120.6458 },
      { id: 3, name: "大甲芋頭城", type: "甜點冰品", score: 4.4, time: "13:00 - 00:00", dist: "便當街 160m", desc: "綿密蜜芋頭，甜而不膩，通宵寫程式的糖分補給。", lat: 24.1803, lng: 120.6459 },
      { id: 4, name: "明倫蛋餅", type: "人氣小吃", score: 4.2, time: "15:00 - 00:30", dist: "福星路 180m", desc: "古早味粉漿蛋餅，口感軟Q偏甜，深夜排隊夯品。", lat: 24.1795, lng: 120.6466 },
      { id: 5, name: "阿華黑輪店", type: "關東煮", score: 4.0, time: "16:30 - 01:00", dist: "文華路夜市 220m", desc: "高湯免費續喝到飽，冬夜熬夜禦寒必備首選。", lat: 24.1809, lng: 120.6452 },
      { id: 6, name: "刁民酸菜魚 (逢甲店)", type: "重口味川味", score: 4.6, time: "11:30 - 02:00", dist: "福星路 350m", desc: "酸爽香麻，辣度過癮。開到凌晨兩點，非常提神。", lat: 24.1765, lng: 120.6462 },
      { id: 7, name: "惡魔雞排 (逢甲總店)", type: "罪惡炸物", score: 4.3, time: "16:00 - 00:30", dist: "文華路 250m", desc: "超厚切多汁雞排，咬下去極度罪惡，高熱量狂歡。", lat: 24.1805, lng: 120.6454 },
      { id: 8, name: "永和豆漿大王 (福星店)", type: "宵夜避難所", score: 3.9, time: "19:00 - 10:00", dist: "福星路 400m", desc: "價格便宜、品項全面，期末考爆肝週的深夜食堂。", lat: 24.1758, lng: 120.6441 },
      { id: 9, name: "激旨燒鳥 (逢甲總店)", type: "日式串燒", score: 4.5, time: "17:00 - 00:30", dist: "文華道會館 600m", desc: "露天座位極有氛圍，獨特肉片包水果串燒百吃不厭。", lat: 24.1825, lng: 120.6482 },
      { id: 10, name: "短腿阿鹿餅乾 (逢甲店)", type: "伴手禮甜點", score: 4.4, time: "16:00 - 23:00", dist: "福星路 200m", desc: "逢甲限定可可曲奇，入口即化，傍晚提早買好當糧草。", lat: 24.1791, lng: 120.6455 },
      { id: 11, name: "黃金右腿雙料雞腿王", type: "起司炸物", score: 4.1, time: "16:00 - 00:00", dist: "文華路 150m", desc: "現烤義式雞腿肉鋪上厚厚一層濃郁焗烤起司醬。", lat: 24.1801, lng: 120.6456 },
      { id: 12, name: "按摩雞排", type: "碳烤炸物", score: 4.0, time: "16:00 - 23:30", dist: "慶和街 280m", desc: "主打不裹粉的健康厚切雞排，先醃後烤鎖住肉汁。", lat: 24.1803, lng: 120.6448 },
      { id: 13, name: "海邊小屋乾燒蛤蜊", type: "海鮮小吃", score: 4.5, time: "18:30 - 23:00", dist: "文華路 210m", desc: "現點現煮大顆鮮美蛤蜊，精華黑蒜黑胡椒汁極其滋補。", lat: 24.1806, lng: 120.6451 },
      { id: 14, name: "小時代雞蛋仔", type: "港式甜點", score: 4.3, time: "16:00 - 23:30", dist: "文華路 190m", desc: "酥脆與Q彈兼具的完美比例，多款創意淋醬可選。", lat: 24.1804, lng: 120.6453 },
      { id: 15, name: "牛排大叔大份量排餐", type: "肉食主義", score: 4.2, time: "11:30 - 23:00", dist: "逢甲商圈 500m", desc: "適合高強度寫硬體實驗後，大口吃肉補鐵補充蛋白質。", lat: 24.1742, lng: 120.6471 },
      { id: 16, name: "逢甲冰菓室", type: "打卡冰品", score: 4.1, time: "12:00 - 23:00", dist: "逢甲正門 100m", desc: "整顆水果當容器的爆量雪花冰，哈密瓜風味大推。", lat: 24.1796, lng: 120.6462 },
      { id: 17, name: "溫家地瓜球", type: "街頭小零嘴", score: 4.2, time: "16:00 - 00:00", dist: "文華路 130m", desc: "老牌地瓜球，越嚼越香，極適合放在電腦旁一顆接一顆。", lat: 24.1799, lng: 120.6459 },
      { id: 18, name: "紅茶臭豆腐", type: "新派小吃", score: 4.0, time: "16:00 - 00:30", dist: "逢甲旗艦夜市 300m", desc: "豆腐製程加入伯爵紅茶釀造，搭配特製醃洋蔥極解膩。", lat: 24.1785, lng: 120.6445 },
      { id: 19, name: "尊品原汁牛肉麵", type: "台式飽腹", score: 4.1, time: "11:00 - 23:00", dist: "文華路 400m", desc: "紅燒湯頭醇厚、牛肉厚切大塊，吃完有滿滿罪惡飽足感。", lat: 24.1812, lng: 120.6438 },
      { id: 20, name: "糖姬冰品輕食館", type: "精緻輕食", score: 4.3, time: "14:00 - 23:00", dist: "福星路 500m", desc: "精緻雪花千層冰，深夜甜食控高壓研討後的靈魂救贖。", lat: 24.1735, lng: 120.6489 }
    ];

    let selectedA = null;
    let selectedB = null;
    let googleMapInstance = null;
    let mapMarkers = [];
    let googleInfoWindow = null; // 💡 建立全域的 InfoWindow 實例

    // 初始化渲染與地圖設定
    function initMap() {
      const grid = document.getElementById('snackGrid');
      // 將卡片改為 div 容器並加入 draggable 支援，內部元素補上 pointer-events-none 防止干擾拖曳
      grid.innerHTML = fcuMidnightFoods.map(food => `
        <div draggable="true" 
             ondragstart="dragFood(event, ${food.id})" 
             onclick="selectFoodForCompare(${food.id})" 
             class="bg-slate-800 hover:bg-slate-700/80 p-3 rounded-xl border border-slate-700/60 text-left transition-all group hover:border-indigo-500/50 cursor-grab active:cursor-grabbing select-none">
          <div class="flex justify-between items-start pointer-events-none">
            <span class="font-bold text-slate-200 group-hover:text-indigo-400 transition-colors text-sm sm:text-base">${food.name}</span>
            <span class="text-[10px] bg-slate-950 text-slate-400 px-1.5 py-0.5 rounded border border-slate-800 shrink-0">${food.type}</span>
          </div>
          <div class="flex items-center justify-between mt-2 text-xs text-slate-400 pointer-events-none">
            <span class="text-amber-400">★ ${food.score}</span>
            <span>📍 ${food.dist}</span>
          </div>
        </div>
      `).join('');

      const fcuMainGate = { lat: 24.1796, lng: 120.6462 }; 
      googleMapInstance = new google.maps.Map(document.getElementById("map"), {
        center: fcuMainGate,
        zoom: 15,
        disableDefaultUI: true 
      });

      // 建立單一 InfoWindow 重複使用
      googleInfoWindow = new google.maps.InfoWindow();

      fcuMidnightFoods.forEach(food => {
        const marker = new google.maps.Marker({
          position: { lat: food.lat, lng: food.lng },
          map: googleMapInstance,
          title: food.name
        });
        
        // 點擊地圖圖針：同步更新交叉對比欄位，並彈出招牌名稱視窗
        marker.addListener("click", () => {
          selectFoodForCompare(food.id);
          popupMarkerWindow(food, marker);
        });

        // 綁定 ID 方便後面卡片聯動地圖
        mapMarkers.push({ id: food.id, instance: marker });
      });
    }

    // 💡 讓名稱出現在地圖上的彈窗函式
    function popupMarkerWindow(food, markerInstance) {
      if (!googleInfoWindow || !googleMapInstance) return;
      
      let targetMarker = markerInstance;
      if (!targetMarker) {
        const found = mapMarkers.find(m => m.id === food.id);
        if (found) targetMarker = found.instance;
      }

      if (targetMarker) {
        googleInfoWindow.setContent(`
          <div class="text-slate-900 p-1 font-sans">
            <h4 class="font-black text-sm text-indigo-600 mb-0.5">${food.name}</h4>
            <p class="text-[11px] text-slate-500 m-0">評分：★ ${food.score} | ${food.type}</p>
            <p class="text-[10px] text-slate-400 m-0 mt-1">${food.desc}</p>
          </div>
        `);
        googleInfoWindow.open(googleMapInstance, targetMarker);
      }
    }

    // 🎛️ HTML5 拖拉 API 邏輯
    function dragFood(ev, id) {
      ev.dataTransfer.setData("text/plain", id);
    }

    function allowDrop(ev) {
      ev.preventDefault();
      // 拖曳進入時的視覺高亮效果
      ev.currentTarget.classList.remove('border-slate-800');
      ev.currentTarget.classList.add('border-indigo-500', 'bg-indigo-950/20');
    }

    function clearDragStyle(element) {
      element.classList.remove('border-indigo-500', 'bg-indigo-950/20');
      element.classList.add('border-slate-800');
    }

    function dropFood(ev, slotLabel) {
      ev.preventDefault();
      clearDragStyle(ev.currentTarget);
      
      const id = parseInt(ev.dataTransfer.getData("text/plain"));
      const food = fcuMidnightFoods.find(f => f.id === id);
      
      if (food) {
        if (slotLabel === 'A') {
          selectedA = food;
          renderSlot('compareSlotA', food, 'A');
        } else {
          selectedB = food;
          renderSlot('compareSlotB', food, 'B');
        }
        
        // 拖放完成後，地圖連線聚焦並跳出泡泡名稱
        if (googleMapInstance && typeof google !== 'undefined') {
          googleMapInstance.panTo({ lat: food.lat, lng: food.lng });
          googleMapInstance.setZoom(16);
          popupMarkerWindow(food);
        }
      }
    }

    // 原有點擊自動填入邏輯（保留作為備用或手機操作）
    function selectFoodForCompare(id) {
      const food = fcuMidnightFoods.find(f => f.id === id);
      
      if (!selectedA || (selectedA && selectedB)) {
        selectedA = food;
        renderSlot('compareSlotA', food, 'A');
      } else {
        selectedB = food;
        renderSlot('compareSlotB', food, 'B');
      }
      
      if (googleMapInstance && typeof google !== 'undefined') {
        googleMapInstance.panTo({ lat: food.lat, lng: food.lng });
        googleMapInstance.setZoom(16);
        popupMarkerWindow(food);
      }
    }

    function renderSlot(slotId, food, label) {
      document.getElementById(slotId).innerHTML = `
        <div class="space-y-2 animate-fade-in">
          <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">店家 ${label}</span>
            <span class="text-xs text-amber-400 font-bold">★ ${food.score}</span>
          </div>
          <h4 class="text-base font-black text-slate-100 mt-1">${food.name}</h4>
          <p class="text-xs text-slate-400"><span class="text-slate-500">時間：</span>${food.time}</p>
          <p class="text-xs text-slate-400"><span class="text-slate-500">位置：</span>${food.dist}</p>
          <p class="text-xs text-slate-400 bg-slate-900 p-2 rounded border border-slate-800 mt-2 leading-relaxed">${food.desc}</p>
        </div>
      `;
    }

    function calculateDecision() {
      const classTime = parseFloat(document.getElementById('classTime').value);
      const remainingWork = parseFloat(document.getElementById('remainingWork').value);
      const mentalState = parseInt(document.getElementById('mentalState').value);
      
      const resultBox = document.getElementById('decisionResult');
      const title = document.getElementById('decisionTitle');
      const reason = document.getElementById('decisionReason');
      const lockOverlay = document.getElementById('snackLockOverlay');
      
      resultBox.classList.remove('hidden');
      
      if (mentalState < 5) {
        title.innerText = "強制睡覺！🚨 (效率極低)";
        reason.innerText = "當前精力值（" + mentalState + "分）極低，大腦已進入當機邊緣。硬熬也只是在發呆，不准浪費時間。系統已同步封鎖深夜宵夜功能，立刻關閉螢幕去睡覺！";
        resultBox.className = "p-5 rounded-2xl border bg-red-500/10 text-red-400 border-red-500/30";
        
        lockOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        lockOverlay.querySelector('h3').innerText = "❌ 禁止選擇宵夜！";
        lockOverlay.querySelector('p').innerText = "系統已對你發出強制就寢命令。精神極差不准再吃高熱量宵夜，現在立刻去躺平休息！";
        return;
      }
      
      if (classTime < 9 && remainingWork > 2) {
        title.innerText = "強制睡覺！⏰ (早八地雷)";
        reason.innerText = "明天一早有早八核心課程，而你還有超過 " + remainingWork + " 小時的工作堆積。繼續熬夜會徹底搞砸明天。建議現在立刻睡覺，明早提早起來趕工。今晚禁止宵夜！";
        resultBox.className = "p-5 rounded-2xl border bg-orange-500/10 text-orange-400 border-orange-500/30";
        
        lockOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        lockOverlay.querySelector('h3').innerText = "❌ 禁止選擇宵夜！";
        lockOverlay.querySelector('p').innerText = "明天有早八還想著吃宵夜？為避免你吃完更睡不著，系統已鎖定美食名單，請立刻執行就寢指令。";
        return;
      }
      
      if (mentalState >= 5 && classTime >= 9 && remainingWork >= 3) {
        title.innerText = "解鎖：肝帝衝刺模式！🔥";
        reason.innerText = "明天沒有早八奪命催，且你當前精神飽滿（" + mentalState + "分），工作量龐大。今晚是個適合把進度推到爆的完美深夜，夜貓子引擎啟動！";
        resultBox.className = "p-5 rounded-2xl border bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
        
        lockOverlay.classList.add('opacity-0', 'pointer-events-none');
        return;
      }
